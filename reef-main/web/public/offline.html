<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Reef Ops — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1b2a;
        color: #f5f1e8;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 auto 24px;
        max-width: 22rem;
        line-height: 1.5;
        color: #c9c4b8;
      }
      button {
        background: #f7d046;
        color: #0d1b2a;
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Reef Ops" />
      <h1>You're offline</h1>
      <p>
        Reef Ops needs a connection to load and save data. Move to an area with signal, then try
        again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
